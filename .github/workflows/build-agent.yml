name: Build and Publish Agent
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (must match APP_VERSION in seller/agent.py)"
        required: true
        default: "1.1.0"
permissions:
  contents: write
jobs:
  build:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]') }}
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || '1.1.0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller aiohttp pyautogui Pillow soundcard numpy aiortc dxcam
          python -m pip check
      - name: Verify source syntax, dependencies and release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          python -m compileall -q seller
          python -c "import sys; sys.path.insert(0, 'seller'); import aiohttp, pyautogui, soundcard, numpy, aiortc, dxcam; from PIL import Image, ImageDraw, ImageGrab; import updater, webrtc_stream; print('ALL DEPENDENCIES AND WEBRTC MODULES OK')"
          $agent = Get-Content -Raw "seller/agent.py"
          $match = [regex]::Match($agent, 'APP_VERSION\s*=\s*["'']([^"'']+)["'']')
          if (-not $match.Success) { throw "APP_VERSION was not found in seller/agent.py" }
          if ($match.Groups[1].Value -ne $env:RELEASE_VERSION) { throw "Workflow version $env:RELEASE_VERSION does not match APP_VERSION $($match.Groups[1].Value)" }
      - name: Ensure release tag does not already exist
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag"
          $exists = $false
          try {
            Invoke-RestMethod -Uri $uri -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" } | Out-Null
            $exists = $true
          } catch {
            $status = 0
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            if ($status -ne 404) { throw }
          }
          if ($exists) { throw "Release tag $tag already exists. Choose a new version." }
      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name agent --paths seller --collect-all aiohttp --collect-all pyautogui --collect-all PIL --collect-all soundcard --collect-all numpy --collect-all aiortc --collect-all av --collect-all dxcam --hidden-import=soundcard.mediafoundation --hidden-import=updater seller/agent.py
      - name: Verify EXE and create update manifest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          if (-not (Test-Path "dist/agent.exe")) { throw "Build failed: dist/agent.exe was not created" }
          $hash = (Get-FileHash "dist/agent.exe" -Algorithm SHA256).Hash.ToLower()
          $manifest = @{ version = $env:RELEASE_VERSION; filename = "agent.exe"; sha256 = $hash } | ConvertTo-Json -Compress
          Set-Content -Path "dist/update.json" -Value $manifest -NoNewline -Encoding utf8
          Get-Item "dist/agent.exe" | Select-Object Name, Length
          Get-Content "dist/update.json"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ env.RELEASE_VERSION }}
          path: |
            dist/agent.exe
            dist/update.json
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Remote Control Agent v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            dist/agent.exe
            dist/update.json
          fail_on_unmatched_files: true
