
name: Build Agent EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests aiohttp

      - name: Locate agent.py
        shell: pwsh
        run: |
          $agent = Get-ChildItem -Path . -Filter agent.py -Recurse -File |
            Select-Object -First 1

          if (-not $agent) {
            throw "agent.py was not found"
          }

          Write-Host "Found: $($agent.FullName)"
          "AGENT_PATH=$($agent.FullName)" >> $env:GITHUB_ENV

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --onefile --noconsole --collect-all aiohttp "$env:AGENT_PATH" --name agent

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: agent-exe
          path: dist/agent.exe
