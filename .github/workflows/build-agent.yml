name: Build Agent EXE - Full Dependencies

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller aiohttp pyautogui Pillow soundcard numpy

      - name: Verify dependencies
        shell: pwsh
        run: |
          python -c "import aiohttp, pyautogui, soundcard, numpy; from PIL import Image, ImageDraw, ImageGrab; print('ALL DEPENDENCIES OK')"

      - name: Locate agent.py
        shell: pwsh
        run: |
          $agent = Get-ChildItem -Path . -Filter agent.py -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\\\(build|dist|\.venv|venv)\\\\' } |
            Select-Object -First 1

          if (-not $agent) {
            throw "agent.py was not found"
          }

          Write-Host "Building from: $($agent.FullName)"
          "AGENT_PATH=$($agent.FullName)" >> $env:GITHUB_ENV

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --console --name agent `
            --collect-all aiohttp `
            --collect-all pyautogui `
            --collect-all PIL `
            --collect-all soundcard `
            --collect-all numpy `
            --hidden-import=soundcard.mediafoundation `
            "$env:AGENT_PATH"

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/agent.exe")) {
            throw "Build failed: dist/agent.exe was not created"
          }
          Get-Item "dist/agent.exe" | Select-Object Name, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: agent-exe-full
          path: dist/agent.exe
          if-no-files-found: error
