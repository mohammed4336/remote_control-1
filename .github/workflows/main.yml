name: Build Agent EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller requests

      - name: Build EXE
        run: |
         $agent = Get-ChildItem -Path . -Filter agent.py -Recurse | Select-Object -First 1
if (-not $agent) { throw "agent.py not found" }
pyinstaller --onefile --noconsole $agent.FullName

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: agent-exe
          path: dist/agent.exe
