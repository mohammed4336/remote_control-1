<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة البائع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d13; --bg2:#0f1420;
    --panel:rgba(255,255,255,.045); --panel-b:rgba(255,255,255,.09);
    --teal:#57f0c9; --teal-d:#3fd1b0; --violet:#8b7fff; --amber:#ffc15c; --danger:#ff5c6c;
    --text:#eaeef4; --muted:#8a93a6;
  }
  *{box-sizing:border-box;margin:0}
  body{
    font-family:'Tajawal',Tahoma,sans-serif;color:var(--text);min-height:100vh;
    background:radial-gradient(900px 500px at 85% -10%,rgba(87,240,201,.10),transparent 60%),
               radial-gradient(700px 500px at -10% 110%,rgba(139,127,255,.10),transparent 60%),var(--bg);
    padding:24px 16px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  .glass{background:var(--panel);border:1px solid var(--panel-b);border-radius:18px;backdrop-filter:blur(10px)}
  button{font-family:inherit;cursor:pointer;border:0;color:inherit}
  button:disabled{opacity:.45;cursor:not-allowed}

  /* رأس الصفحة */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--teal);box-shadow:0 0 18px 4px rgba(87,240,201,.6)}
  h1{font-size:22px;font-weight:900}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .head-actions{display:flex;gap:8px}
  .btn{padding:10px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-b);font-weight:500;font-size:14px;transition:.15s}
  .btn:hover:not(:disabled){border-color:rgba(87,240,201,.45);background:rgba(87,240,201,.08)}
  .btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#06110e;border:0;font-weight:700}
  .btn.primary:hover:not(:disabled){filter:brightness(1.07);background:linear-gradient(135deg,var(--teal),var(--teal-d))}
  .btn.warn:hover:not(:disabled){border-color:rgba(255,193,92,.6);background:rgba(255,193,92,.1)}
  .btn.danger:hover:not(:disabled){border-color:rgba(255,92,108,.6);background:rgba(255,92,108,.12)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}

  /* الإحصائيات */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{padding:16px 18px}
  .stat span{color:var(--muted);font-size:13px}
  .stat strong{display:block;font-size:30px;font-weight:900;margin-top:4px}
  .stat.s-pending strong{color:var(--amber)} .stat.s-active strong{color:var(--teal)} .stat.s-bad strong{color:var(--danger)}

  /* الأدوات */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .search{flex:1;min-width:200px;padding:12px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--panel-b);color:var(--text);font-family:inherit;font-size:15px}
  .search:focus{outline:none;border-color:rgba(87,240,201,.5)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:8px 14px;border-radius:999px;background:transparent;border:1px solid var(--panel-b);font-size:13px;color:var(--muted)}
  .chip.on{background:rgba(87,240,201,.14);border-color:rgba(87,240,201,.5);color:var(--teal);font-weight:700}

  /* بطاقات الحسابات */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{padding:18px;display:flex;flex-direction:column;gap:14px}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .uname{font-size:19px;font-weight:700;word-break:break-all}
  .uname.none{color:var(--muted);font-weight:400;font-size:15px}
  .badge{padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  .b-active{background:rgba(87,240,201,.15);color:var(--teal)}
  .b-pending{background:rgba(255,193,92,.15);color:var(--amber)}
  .b-bad{background:rgba(255,92,108,.15);color:var(--danger)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px}
  .meta div span{display:block;color:var(--muted);font-size:12px;margin-bottom:1px}
  .meta bdi{direction:ltr;unicode-bidi:isolate}
  .live{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;background:var(--muted)}
  .live.on{background:var(--teal);box-shadow:0 0 8px 2px rgba(87,240,201,.7)}

  .plan{border-top:1px solid var(--panel-b);padding-top:14px;display:flex;flex-direction:column;gap:10px}
  .plan-label{font-size:12px;color:var(--muted)}
  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .preset{padding:7px 12px;border-radius:10px;background:transparent;border:1px solid var(--panel-b);font-size:13px}
  .preset.on{border-color:var(--teal);color:var(--teal);background:rgba(87,240,201,.1);font-weight:700}
  .days-in{width:78px;padding:7px 10px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--panel-b);color:var(--text);font-family:inherit;text-align:center}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .more{display:flex;gap:6px;flex-wrap:wrap}

  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
    padding:12px 20px;border-radius:12px;background:#10161f;border:1px solid var(--panel-b);transition:.25s;z-index:9;font-size:14px;max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:rgba(255,92,108,.6);color:#ffb3bb}
  .toast.ok{border-color:rgba(87,240,201,.5);color:var(--teal)}

  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr)} .grid{grid-template-columns:1fr} h1{font-size:19px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="dot"></div>
      <div><h1>لوحة البائع</h1><div class="sub" id="updated">إدارة الحسابات والاشتراكات</div></div>
    </div>
    <div class="head-actions">
      <button class="btn" id="refreshBtn">تحديث</button>
      <button class="btn" id="logoutBtn">خروج</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat glass"><span>إجمالي الحسابات</span><strong id="stTotal">0</strong></div>
    <div class="stat glass s-pending"><span>بانتظار التفعيل</span><strong id="stPending">0</strong></div>
    <div class="stat glass s-active"><span>اشتراكات فعّالة</span><strong id="stActive">0</strong></div>
    <div class="stat glass s-bad"><span>موقوفة أو منتهية</span><strong id="stBad">0</strong></div>
  </section>

  <div class="toolbar">
    <input class="search" id="search" placeholder="ابحث باسم المستخدم أو الجهة..." autocomplete="off">
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">الكل</button>
      <button class="chip" data-f="pending">بانتظار التفعيل</button>
      <button class="chip" data-f="active">فعّال</button>
      <button class="chip" data-f="bad">موقوف / منتهي</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const PRESETS = [[30,'شهر'],[90,'3 أشهر'],[180,'6 أشهر'],[365,'سنة']];
const $ = id => document.getElementById(id);
let accounts = [];
let filter = 'all';
const chosen = {};          // code -> عدد الأيام المختار
let toastTimer;

function toast(msg, kind){
  const t = $('toast'); t.textContent = msg; t.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.className = 'toast', 3200);
}

function stateOf(a){
  const now = Date.now()/1000;
  if(a.status === 'pending') return 'pending';
  if(a.status !== 'active') return 'bad';
  if(a.expires_at && a.expires_at < now) return 'bad';
  return 'active';
}
function labelOf(a){
  if(a.status === 'pending') return 'بانتظار التفعيل';
  if(a.status !== 'active') return 'موقوف';
  if(a.expires_at && a.expires_at < Date.now()/1000) return 'منتهي';
  return 'فعّال';
}
function fmtDate(ts){ return ts ? new Date(ts*1000).toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'}) : '—'; }
function daysLeft(a){
  if(!a.expires_at) return 'بدون انتهاء';
  const d = Math.ceil((a.expires_at - Date.now()/1000)/86400);
  return d >= 0 ? 'باقي ' + d + ' يوم' : 'منتهي منذ ' + (-d) + ' يوم';
}

async function api(path, method, body){
  const r = await fetch(path, {
    method: method || 'GET', credentials: 'same-origin', cache: 'no-store',
    headers: {'Content-Type':'application/json'},
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if(r.status === 401){ location.reload(); throw new Error('انتهت الجلسة'); }
  const d = await r.json().catch(()=> ({}));
  if(!r.ok || d.ok === false) throw new Error(d.error || 'تعذر تنفيذ العملية');
  return d;
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text !== undefined) e.textContent = text;
  return e;
}
function metaItem(label, value, ltr){
  const d = el('div'); d.appendChild(el('span', '', label));
  if(ltr){ const b = document.createElement('bdi'); b.textContent = value; d.appendChild(b); }
  else d.appendChild(document.createTextNode(value));
  return d;
}

function buildCard(a){
  const st = stateOf(a);
  const card = el('div', 'card glass');

  const top = el('div', 'card-top');
  top.appendChild(el('div', 'uname' + (a.username ? '' : ' none'), a.username || 'لم يكمل إنشاء الحساب'));
  top.appendChild(el('span', 'badge b-' + st, labelOf(a)));
  card.appendChild(top);

  const meta = el('div', 'meta');
  meta.appendChild(metaItem('جهة التحقق', a.masked_contact || '—', true));
  meta.appendChild(metaItem('تاريخ التسجيل', fmtDate(a.created_at)));
  meta.appendChild(metaItem('الاشتراك', a.expires_at ? fmtDate(a.expires_at) + ' — ' + daysLeft(a) : (st === 'active' ? 'بدون انتهاء' : '—')));
  const dev = el('div'); dev.appendChild(el('span', '', 'الجهاز'));
  const live = el('i', 'live' + (a.online ? ' on' : '')); dev.appendChild(live);
  dev.appendChild(document.createTextNode(a.has_pc ? (a.agent_name || 'مربوط') + (a.online ? ' (متصل)' : '') : 'لم يُربط بعد'));
  if(a.agent_ip){ const b = document.createElement('bdi'); b.style.cssText = 'display:block;color:var(--muted);font-size:12px'; b.textContent = a.agent_ip; dev.appendChild(b); }
  meta.appendChild(dev);
  card.appendChild(meta);

  // الاشتراك
  const plan = el('div', 'plan');
  plan.appendChild(el('div', 'plan-label', st === 'active' ? 'تمديد الاشتراك' : 'تفعيل الاشتراك'));
  const days = chosen[a.code] || 30;
  const presets = el('div', 'presets');
  const input = el('input', 'days-in'); input.type = 'number'; input.min = 1; input.max = 3650; input.value = days;
  PRESETS.forEach(([d, name])=>{
    const b = el('button', 'preset' + (d === days ? ' on' : ''), name + ' · ' + d);
    b.addEventListener('click', ()=>{
      chosen[a.code] = d; input.value = d;
      presets.querySelectorAll('.preset').forEach(x => x.classList.toggle('on', x === b));
    });
    presets.appendChild(b);
  });
  input.addEventListener('input', ()=>{
    chosen[a.code] = Number(input.value);
    presets.querySelectorAll('.preset').forEach(x => x.classList.remove('on'));
  });
  plan.appendChild(presets);

  const row = el('div', 'row');
  row.appendChild(input); row.appendChild(el('span', 'sub', 'يوم'));
  const go = el('button', 'btn primary sm', st === 'active' ? 'تمديد' : 'تفعيل الاشتراك');
  go.addEventListener('click', ()=>{
    const n = Number(input.value);
    if(!Number.isInteger(n) || n < 1 || n > 3650){ toast('أدخل عدد أيام من 1 إلى 3650', 'err'); return; }
    run(a, st === 'active' ? 'extend' : 'activate', {days: n}, (st === 'active' ? 'تمديد ' : 'تفعيل ') + (a.username || a.code) + ' لمدة ' + n + ' يوم؟', go);
  });
  row.appendChild(go);
  plan.appendChild(row);
  card.appendChild(plan);

  // إجراءات ثانوية
  const more = el('div', 'more');
  const add = (text, cls, action, confirmText) => {
    const b = el('button', 'btn sm ' + cls, text);
    b.addEventListener('click', ()=> run(a, action, {}, confirmText, b));
    more.appendChild(b);
  };
  const who = a.username || a.code;
  if(a.status === 'active') add('إيقاف', 'warn', 'revoke', 'إيقاف حساب ' + who + '؟ ينقطع اتصاله خلال نصف دقيقة.');
  if(a.status === 'revoked') add('إعادة تشغيل', '', 'restore', 'إعادة تشغيل حساب ' + who + '؟');
  if(a.has_pc) add('فك ربط الجهاز', '', 'reset_agent', 'فك ربط جهاز ' + who + '؟ يقدر يربط كمبيوتر جديد.');
  if(a.has_phone) add('فك ربط الجوال', '', 'reset_phone', 'فك ربط جوال ' + who + '؟ يحتاج رمز تحقق ليدخل من جديد.');
  add('حذف', 'danger', 'delete', 'حذف حساب ' + who + ' نهائيًا؟ لا يمكن التراجع.');
  card.appendChild(more);
  return card;
}

async function run(a, action, body, confirmText, btn){
  if(!confirm(confirmText)) return;
  btn.disabled = true;
  try{
    await api('/seller/api/licenses/' + encodeURIComponent(a.code) + '/' + action, 'POST', body);
    toast('تم بنجاح ✓', 'ok');
    await load(true);
  }catch(e){ toast(e.message, 'err'); btn.disabled = false; }
}

function render(){
  const q = $('search').value.trim().toLowerCase();
  const list = accounts.filter(a =>
    (filter === 'all' || stateOf(a) === filter) &&
    (!q || [a.username, a.masked_contact, a.agent_name].some(v => String(v || '').toLowerCase().includes(q))));
  const grid = $('grid'); grid.replaceChildren();
  if(!list.length){
    const e = el('div', 'empty glass', accounts.length ? 'لا توجد نتائج مطابقة.' : 'لا توجد حسابات بعد. لما يسجّل أول زبون يظهر هنا.');
    e.style.gridColumn = '1/-1'; grid.appendChild(e); return;
  }
  list.forEach(a => grid.appendChild(buildCard(a)));
}

function stats(){
  const c = {pending:0, active:0, bad:0};
  accounts.forEach(a => c[stateOf(a)]++);
  $('stTotal').textContent = accounts.length;
  $('stPending').textContent = c.pending;
  $('stActive').textContent = c.active;
  $('stBad').textContent = c.bad;
}

async function load(silent){
  try{
    const d = await api('/seller/api/licenses');
    accounts = d.licenses || [];
    stats(); render();
    $('updated').textContent = 'آخر تحديث: ' + new Date().toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ if(!silent) toast(e.message, 'err'); }
}

$('refreshBtn').addEventListener('click', ()=> load());
$('search').addEventListener('input', render);
$('chips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === b));
  render();
});
$('logoutBtn').addEventListener('click', async ()=>{
  try{ await fetch('/seller/logout', {method:'POST', credentials:'same-origin'}); }catch(e){}
  location.reload();
});

load();
setInterval(()=>{ if(!document.hidden && !document.querySelector('.days-in:focus')) load(true); }, 30000);
</script>
</body>
</html>
